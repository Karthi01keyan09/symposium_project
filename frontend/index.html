<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBMS Operations Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Animated background blobs */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite alternate;
        }
        body::before {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #6c63ff, transparent);
            top: -100px; left: -100px;
        }
        body::after {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #f09af9, transparent);
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }
        @keyframes float {
            to { transform: translate(30px, 30px); }
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #f09af9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            width: 280px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-color: rgba(108, 99, 255, 0.5);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DBMS Operations Demo</h1>
        <p>Select your role to explore the CRUD operations</p>

        <div class="cards">
            <a href="register.html" class="card">
                <div class="icon">🎓</div>
                <h2>Student</h2>
                <p>Register as a student (Create)</p>
            </a>
            
            <a href="admin.html" class="card">
                <div class="icon">🔐</div>
                <h2>Admin</h2>
                <p>Manage database (Read, Update, Delete)</p>
            </a>
        </div>
    </div>

</body>
</html>
