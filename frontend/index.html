<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgba(10, 5, 20, 0.65), rgba(10, 5, 20, 0.75)), url('images/bg_home_collage.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 40px;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #9d4edd, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 50px;
        }

        .cards {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(20, 10, 30, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 12px;
            padding: 40px;
            width: 280px;
            cursor: pointer;
            text-decoration: none;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
        }

        .card:hover::before {
            left: 150%;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.4);
            border-color: #ff0055;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .card h2 {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card p {
            font-size: 0.9rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>College Event Management System</h1>
        <p>Select your role to explore the CRUD operations</p>

        <div class="cards">
            <a href="events.html" class="card">
                <div class="icon">🎓</div>
                <h2>Student</h2>
                <p>Explore events and register</p>
            </a>
            
            <a href="admin.html" class="card">
                <div class="icon">🔐</div>
                <h2>Admin</h2>
                <p>Manage database</p>
            </a>
        </div>
    </div>

</body>
</html>
